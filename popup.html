<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>TabScribe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="9" width="13" height="13" rx="2" fill="currentColor"/>
          <rect x="2" y="2" width="13" height="13" rx="2" fill="currentColor" fill-opacity="0.7"/>
          <path d="M9 15 L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 5 L15 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        TabScribe
      </h1>
      
      <div class="extraction-mode-mini">
        <div class="toggle-container-mini">
          <input type="checkbox" id="extractionModeToggle" class="toggle-checkbox" aria-label="Alternar entre modo inteligente e completo">
          <label for="extractionModeToggle" class="toggle-label-mini">
            <span class="toggle-inner"></span>
            <span class="toggle-switch"></span>
          </label>
        </div>
      </div>
    </header>
    
    <section id="tabsSection">
      <div class="search-toolbar">
        <input type="checkbox" id="selectAllCheckbox" aria-label="Selecionar todas as abas">
        <input type="search" id="searchTabsInput" placeholder="Buscar abas...">
      </div>
      <div id="tabsList"></div>
    </section>
    
    <section id="buttonsSection">
      <div class="format-toggle">
        <input type="checkbox" id="markdownToggle">
        <label for="markdownToggle">Exportar como Markdown</label>
      </div>
      <div class="action-buttons">
        <button id="copyButton" aria-label="Copiar texto para a área de transferência">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 5H6C4.89543 5 4 5.89543 4 7V19C4 20.1046 4.89543 21 6 21H16C17.1046 21 18 20.1046 18 19V17M16 3H10C8.89543 3 8 3.89543 8 5V15C8 16.1046 8.89543 17 10 17H16C17.1046 17 18 16.1046 18 15V5C18 3.89543 17.1046 3 16 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Copiar Texto
      </button>
      <button id="downloadButton" aria-label="Baixar arquivo .txt com os textos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15V3M12 15L8 11M12 15L16 11M21 15V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Baixar .txt
      </button>
      </div>
    </section>
    
    <div id="status" role="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
